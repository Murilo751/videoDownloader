name: Tests
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests and coverage in Compose
        env:
          APP_PASSWORD: ci-only-password
        run: docker compose run --build --rm tests
