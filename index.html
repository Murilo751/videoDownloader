<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo de vídeos</title>
<style>
:root{font-family:system-ui,sans-serif;color:#1d2433;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}header{background:#15223e;color:white;padding:1.3rem max(1rem,calc((100vw - 1120px)/2))}header h1{margin:0;font-size:1.7rem}main{max-width:1120px;margin:2rem auto;padding:0 1rem}section{background:white;border-radius:12px;padding:1.3rem;margin-bottom:1rem;box-shadow:0 2px 14px #1d243314}h2{margin:.2rem 0 1rem}form,.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.7rem}label{display:grid;gap:.3rem;font-size:.9rem;font-weight:600}input,select,button{font:inherit;padding:.65rem;border:1px solid #bac5d7;border-radius:7px}button{background:#235bd8;color:white;border:0;cursor:pointer}button:hover{background:#1748b5}button.secondary{background:#e5ebf7;color:#203456}button.danger{background:#b72737}button:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:end}.wide{grid-column:1/-1}#message{min-height:1.5rem;color:#a62030}#login{max-width:460px}table{border-collapse:collapse;width:100%}th,td{text-align:left;border-bottom:1px solid #e5e9f0;padding:.65rem}th button{background:transparent;color:#1d2433;padding:0;font-weight:700}td .actions{min-width:240px}td button{font-size:.8rem;padding:.35rem}.scroll{overflow:auto}.chart{display:grid;gap:.4rem;margin-bottom:1rem}.bar{display:flex;align-items:center;gap:.5rem}.bar span{min-width:110px}.bar b{display:block;background:#5b8cff;height:18px;border-radius:4px;min-width:3px}.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}@media(max-width:600px){main{margin:1rem auto}td .actions{min-width:130px}}
</style>
</head>
<body><header><h1>Catálogo de vídeos</h1><p>Organize links e acompanhe seus registros</p></header><main>
<section id="login"><h2>Entrar</h2><form id="login-form"><label>Usuário<input name="username" required autocomplete="username"></label><label>Senha<input name="password" type="password" required autocomplete="current-password"></label><div class="actions"><button>Entrar</button></div></form></section>
<div id="app" hidden>
<section><h2 id="form-title">Adicionar vídeo</h2><form id="record-form"><input name="id" type="hidden"><label>Título *<input name="title" required maxlength="150"></label><label>URL *<input name="url" type="url" required></label><label>Categoria *<input name="category" required maxlength="80"></label><label>Criador *<input name="creator" required maxlength="100"></label><label>Duração (minutos)<input name="duration_minutes" type="number" min="0" value="0"></label><label>Ativo<select name="active"><option value="true">Sim</option><option value="false">Não</option></select></label><div class="actions wide"><button>Salvar</button><button type="button" class="secondary" id="cancel-edit">Limpar</button></div></form></section>
<section><h2>Buscar e listar</h2><form id="filters" class="filters"><label>Título<input name="title"></label><label>Categoria<input name="category"></label><label>Criador<input name="creator"></label><label>Ordenar<select name="sort"><option value="id">ID</option><option value="title">Título</option><option value="category">Categoria</option><option value="creator">Criador</option><option value="duration_minutes">Duração</option></select></label><label>Direção<select name="direction"><option value="asc">Crescente</option><option value="desc">Decrescente</option></select></label><div class="actions wide"><button>Buscar</button><button type="button" class="secondary" id="clear-filters">Limpar filtros</button><button type="button" class="secondary" id="export">Exportar CSV</button></div></form><div class="scroll"><table><thead><tr><th>Sel.</th><th>ID</th><th>Título</th><th>Categoria</th><th>Criador</th><th>Duração</th><th>Status</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button type="button" class="danger" id="delete-selected">Excluir selecionados</button><button type="button" class="secondary" id="previous">Anterior</button><span id="page-label">Página 1</span><button type="button" class="secondary" id="next">Próxima</button></div></section>
<section><h2>Indicadores</h2><div class="charts"><div><h3>Por categoria</h3><div id="categories" class="chart"></div></div><div><h3>Por status</h3><div id="statuses" class="chart"></div></div><div><h3>Por criador</h3><div id="creators" class="chart"></div></div></div></section>
</div><p id="message" role="alert"></p></main>
<script>
const $=id=>document.getElementById(id);let page=1,items=[];
async function api(path,options={}){const response=await fetch('/api/web/'+path,{credentials:'same-origin',...options});if(response.status===401){$('app').hidden=true;$('login').hidden=false;throw Error('Entre para continuar.')}if(!response.ok){const data=await response.json().catch(()=>({}));throw Error(data.error||'Falha na requisição')}return response}
function message(error){$('message').textContent=error instanceof Error?error.message:String(error)}
function params(){const form=new FormData($('filters'));return new URLSearchParams([...form].filter(([,value])=>value)).toString()}
async function load(){try{const response=await api('records/search?'+params()+'&page='+page);const data=await response.json();items=data.items;const body=$('rows');body.replaceChildren();for(const record of items){const tr=document.createElement('tr');const selection=document.createElement('td');const check=document.createElement('input');check.type='checkbox';check.value=record.id;check.className='selected-record';check.setAttribute('aria-label','Selecionar registro '+record.id);selection.append(check);tr.append(selection);for(const key of ['id','title','category','creator','duration_minutes','active']){const td=document.createElement('td');td.textContent=key==='active'?(record.active?'Ativo':'Inativo'):record[key];tr.append(td)}const actions=document.createElement('td');actions.className='actions';for(const [label,action,kind] of [['Editar','edit','secondary'],[record.active?'Desativar':'Ativar','status','secondary'],['Duplicar','duplicate','secondary'],['Excluir','delete','danger']]){const button=document.createElement('button');button.textContent=label;button.className=kind;button.onclick=()=>act(action,record);actions.append(button)}tr.append(actions);body.append(tr)}$('page-label').textContent='Página '+page;$('previous').disabled=page<=1;$('next').disabled=!data.has_next;$('login').hidden=true;$('app').hidden=false;message('')}catch(error){message(error)}}
async function dashboard(){try{const data=await (await api('dashboard')).json();for(const key of ['categories','statuses','creators']){const target=$(key);target.replaceChildren();const max=Math.max(1,...data[key].map(item=>item.value));for(const item of data[key]){const row=document.createElement('div');row.className='bar';const name=document.createElement('span');name.textContent=item.label;const bar=document.createElement('b');bar.style.width=(item.value/max*65)+'%';const count=document.createElement('strong');count.textContent=item.value;row.append(name,bar,count);target.append(row)}if(!data[key].length)target.textContent='Sem dados'}}catch(error){message(error)}}
async function refresh(){await load();await dashboard()}
function resetForm(){$('record-form').reset();$('record-form').elements.id.value='';$('form-title').textContent='Adicionar vídeo'}
async function act(action,record){try{if(action==='edit'){for(const key of ['id','title','url','category','creator','duration_minutes'])$('record-form').elements[key].value=record[key];$('record-form').elements.active.value=String(record.active);$('form-title').textContent='Editar vídeo #'+record.id;window.scrollTo(0,0);return}if(action==='delete'){if(!confirm('Excluir o registro #'+record.id+'?'))return;await api('records/'+record.id,{method:'DELETE'})}if(action==='status')await api('records/'+record.id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:!record.active})});if(action==='duplicate')await api('records/'+record.id+'/duplicate',{method:'POST'});await refresh()}catch(error){message(error)}}
$('login-form').onsubmit=async event=>{event.preventDefault();try{const data=Object.fromEntries(new FormData(event.target));const response=await fetch('/api/web/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!response.ok)throw Error('Usuário ou senha inválidos');event.target.reset();await refresh()}catch(error){message(error)}};
$('record-form').onsubmit=async event=>{event.preventDefault();try{const form=Object.fromEntries(new FormData(event.target));const id=form.id;delete form.id;form.duration_minutes=Number(form.duration_minutes||0);form.active=form.active==='true';await api('records'+(id?'/'+id:''),{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(form)});resetForm();await refresh()}catch(error){message(error)}};
$('filters').onsubmit=event=>{event.preventDefault();page=1;load()};$('clear-filters').onclick=()=>{$('filters').reset();page=1;load()};$('cancel-edit').onclick=resetForm;$('previous').onclick=()=>{page--;load()};$('next').onclick=()=>{page++;load()};$('delete-selected').onclick=async()=>{const ids=[...document.querySelectorAll('.selected-record:checked')].map(input=>input.value);if(!ids.length||!confirm('Excluir '+ids.length+' registro(s)?'))return;try{for(const id of ids)await api('records/'+id,{method:'DELETE'});await refresh()}catch(error){message(error)}};$('export').onclick=async()=>{try{const response=await api('records/export?'+params());const blob=await response.blob();const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='videos.csv';link.click();URL.revokeObjectURL(url)}catch(error){message(error)}};refresh();
</script></body></html>
